<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>世界觀架構工作台 | WorldBuilder Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-sidebar: #ffffff;
      --bg-card: #ffffff;
      --border: #e2e8f0;
      --border-focus: #6366f1;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-light: #eef2ff;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --danger-light: #fee2e2;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.1);
      --font-family: 'Plus Jakarta Sans', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-main);
      color: var(--text-primary);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header.app-bar {
      height: 54px;
      min-height: 54px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 30;
      gap: 8px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .menu-toggle-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      transition: background 0.15s;
    }
    .menu-toggle-btn:hover { background: #e2e8f0; }

    .world-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-light);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      max-width: 170px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-switch {
      display: flex;
      background: #f1f5f9;
      padding: 3px;
      border-radius: var(--radius-md);
      gap: 2px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: white;
      color: var(--accent);
      box-shadow: var(--shadow-sm);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: white;
      border-color: var(--border);
      color: var(--text-primary);
    }
    .btn-secondary:hover { background: #f8fafc; border-color: #cbd5e1; }

    .btn-danger {
      background: #fff;
      border-color: #fecaca;
      color: var(--danger);
    }
    .btn-danger:hover { background: var(--danger-light); }

    /* App Body */
    .app-body {
      flex: 1;
      display: flex;
      height: calc(100vh - 54px);
      height: calc(100dvh - 54px);
      position: relative;
      overflow: hidden;
    }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(2px);
      z-index: 40;
      display: none;
    }
    .sidebar-overlay.active { display: block; }

    /* Left Sidebar (Collapsible in Desktop & Mobile) */
    aside.sidebar {
      width: 320px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 45;
      transition: transform 0.25s ease, width 0.25s ease;
      overflow: hidden;
    }
    aside.sidebar.desktop-collapsed {
      width: 0 !important;
      border-right: none;
    }

    .sidebar-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-width: 320px;
    }

    .sidebar-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }

    .icon-btn-group { display: flex; gap: 4px; align-items: center; }
    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 14px;
      transition: all 0.15s;
    }
    .icon-btn:hover { background: #f1f5f9; color: var(--text-primary); }
    .icon-btn.active-danger {
      background: var(--danger-light);
      color: var(--danger);
      border-color: #fca5a5;
    }

    .batch-bar {
      padding: 8px 12px;
      background: #fef2f2;
      border-bottom: 1px solid #fecaca;
      display: none;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #991b1b;
      font-weight: 600;
      min-width: 320px;
    }
    .batch-bar.active { display: flex; }

    .search-box {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      min-width: 320px;
    }

    .search-input {
      width: 100%;
      padding: 6px 10px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      outline: none;
      background: #f8fafc;
    }
    .search-input:focus { border-color: var(--border-focus); background: white; }

    .tree-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      min-width: 320px;
      -webkit-overflow-scrolling: touch;
    }

    /* Worldview Block */
    .world-block {
      background: #fafafa;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .world-block.active-world {
      border-color: var(--accent);
      background: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    .world-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      cursor: pointer;
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
    }
    .world-block.active-world .world-header { background: #eef2ff; }

    .world-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .node-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      margin: 2px 0;
      font-size: 13px;
      color: var(--text-secondary);
      transition: background 0.15s;
    }
    .node-row:hover { background: #f1f5f9; color: var(--text-primary); }
    .node-row.active {
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 600;
    }
    .node-row.drag-over {
      background: #e0e7ff;
      outline: 2px dashed var(--accent);
    }

    .node-left {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .node-checkbox {
      display: none;
      margin-right: 4px;
      cursor: pointer;
    }
    .batch-mode .node-checkbox { display: inline-block; }

    .node-icon { font-size: 15px; cursor: pointer; flex-shrink: 0; }
    .node-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .node-actions { display: none; gap: 2px; }
    .node-row:hover .node-actions { display: flex; }

    .folder-children {
      padding-left: 14px;
      border-left: 1px dashed #cbd5e1;
      margin-left: 10px;
    }

    .doc-meta-mini {
      font-size: 10px;
      color: var(--text-muted);
      margin-left: 4px;
    }

    /* Main View Area */
    .main-view {
      flex: 1;
      height: 100%;
      position: relative;
      background: var(--bg-main);
      overflow: hidden;
    }

    /* Document Editor View */
    #editorView {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: white;
    }

    /* Top Breadcrumb & Hierarchy Bar */
    .breadcrumb-bar {
      padding: 8px 24px 0 24px;
      display: flex;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 4px;
    }
    .breadcrumb-item {
      color: var(--text-secondary);
      font-weight: 600;
      position: relative;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .breadcrumb-item:hover {
      color: var(--accent);
      background: #f1f5f9;
    }
    .breadcrumb-sep { color: #cbd5e1; font-size: 11px; }

    /* Breadcrumb Dropdown on Hover */
    .breadcrumb-item .hover-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      padding: 6px;
      min-width: 170px;
      display: none;
      flex-direction: column;
      gap: 3px;
      z-index: 50;
    }
    .breadcrumb-item:hover .hover-dropdown { display: flex; }
    .dropdown-doc-link {
      padding: 5px 8px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--text-primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dropdown-doc-link:hover {
      background: var(--accent-light);
      color: var(--accent);
    }

    .editor-top-bar {
      padding: 8px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .editor-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .stat-pill {
      background: #f1f5f9;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .editor-actions-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .editor-scroll-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 32px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .doc-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .doc-icon-picker-btn {
      font-size: 24px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: var(--radius-sm);
    }
    .doc-icon-picker-btn:hover { background: #f1f5f9; }

    .title-input {
      font-size: 24px;
      font-weight: 700;
      border: none;
      outline: none;
      color: var(--text-primary);
      width: 100%;
      font-family: inherit;
    }

    .toc-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 12px;
    }
    .toc-title {
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .toc-links { display: flex; flex-wrap: wrap; gap: 6px; }
    .toc-chip {
      background: white;
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s;
    }
    .toc-chip:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* Hashtag Toolbar */
    .hashtag-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-height: 28px;
    }
    .tag-chip {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s;
    }
    .tag-chip:hover { transform: scale(1.04); }
    .tag-jump-name { cursor: pointer; }
    .tag-color-arrow { font-size: 9px; opacity: 0.7; cursor: pointer; padding-left: 2px; }
    .tag-color-arrow:hover { opacity: 1; }

    .btn-add-tag {
      background: #f1f5f9;
      border: 1px dashed #cbd5e1;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      color: var(--text-secondary);
      cursor: pointer;
      font-weight: 600;
    }

    .doc-images-strip { display: flex; flex-wrap: wrap; gap: 10px; }
    .img-preview-box {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .img-preview-box img { width: 100%; height: 100%; object-fit: cover; }
    .img-del-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(15, 23, 42, 0.75);
      color: white;
      border: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 11px;
      cursor: pointer;
    }

    .content-textarea {
      flex: 1;
      min-height: 380px;
      border: none;
      outline: none;
      resize: none;
      font-size: 15px;
      line-height: 1.8;
      color: #334155;
      font-family: inherit;
    }

    /* Whiteboard Canvas */
    #canvasView {
      display: none;
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #f8fafc;
      background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
      background-size: 24px 24px;
      overflow: hidden;
      touch-action: none;
    }

    .canvas-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      max-width: 650px;
    }

    .canvas-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    .canvas-svg g, .canvas-svg path, .canvas-svg text { pointer-events: all; }

    .relation-line {
      stroke: #6366f1;
      stroke-width: 2.5;
      fill: none;
      cursor: pointer;
      transition: stroke 0.2s;
    }
    .relation-line:hover { stroke: #4338ca; stroke-width: 4; }

    .line-label-bg {
      fill: white;
      stroke: #c7d2fe;
      stroke-width: 1.5;
      rx: 6;
      ry: 6;
      cursor: pointer;
    }
    .line-label-box {
      font-size: 11px;
      font-weight: 600;
      fill: #1e293b;
      cursor: pointer;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .canvas-node {
      position: absolute;
      width: 200px;
      background: white;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 10px;
      cursor: grab;
      z-index: 2;
      touch-action: none;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .canvas-node:hover { box-shadow: var(--shadow-md); border-color: #cbd5e1; }
    .canvas-node.connecting {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .node-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .node-title-txt {
      font-size: 12px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 130px;
    }
    .node-connect-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #eef2ff;
      color: var(--accent);
      border: 1px solid #c7d2fe;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
    }
    .node-img-thumb {
      width: 100%;
      height: 75px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
    }
    .node-snippet {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 6px;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }

    .modal-card {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 480px;
      max-width: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 16px; font-weight: 700; }

    .color-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .color-badge-demo {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      min-width: 65px;
      text-align: center;
    }

    .form-input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      outline: none;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-top: 6px;
    }
    .emoji-opt {
      font-size: 22px;
      text-align: center;
      padding: 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border: 1px solid var(--border);
    }
    .emoji-opt:hover { background: #f1f5f9; }

    .color-picker-popup {
      position: absolute;
      background: white;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      padding: 8px;
      z-index: 60;
      display: none;
      flex-direction: column;
      gap: 4px;
      min-width: 180px;
    }
    .color-picker-popup.active { display: flex; }

    .picker-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12px;
    }
    .picker-option:hover { background: #f1f5f9; }

    .export-item-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 6px;
      border-radius: var(--radius-sm);
      font-size: 13px;
    }
    .export-item-row:hover { background: #f8fafc; }

    /* Mobile Responsive Optimizations */
    @media (max-width: 768px) {
      .brand span:nth-child(2) { display: none; }
      .world-badge { max-width: 110px; font-size: 11px; padding: 3px 7px; }
      .top-actions { gap: 4px; }
      .top-actions .btn { padding: 5px 8px; font-size: 11px; }
      
      aside.sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 86vw;
        max-width: 320px;
        transform: translateX(-100%);
        box-shadow: 4px 0 20px rgba(0,0,0,0.15);
      }
      aside.sidebar.drawer-open { transform: translateX(0); }
      .editor-scroll-body { padding: 14px 16px; }

      .editor-top-bar { padding: 8px 16px; }

  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="app-bar">
    <div class="brand-section">
      <button class="menu-toggle-btn" id="sidebarCollapseBtn" onclick="toggleSidebarMenu()" title="展開/收納側邊欄">☰</button>

      <button class="tab-btn active" id="tabEditorBtn" onclick="switchView('editor')">

        🕸️ 白板

    <div class="top-actions">

      <button class="btn btn-primary" onclick="createNewDoc(null)">＋ 新文檔</button>
    </div>
  </header>

  <!-- Mobile Drawer Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarMobile()"></div>

  <!-- Workspace Body -->
  <div class="app-body">
    <!-- Left Sidebar: Multi-level Folder & Worldview Tree -->
    <aside class="sidebar" id="appSidebar">
      <div class="sidebar-header">
        <div style="display:flex; align-items:center; gap:6px;">
          <button class="icon-btn" id="trashToggleBtn" title="開啟/關閉批量刪除模式" onclick="toggleBatchDeleteMode()">🗑️</button>
          <span class="sidebar-title">世界觀與目錄</span>
        </div>
        <div class="icon-btn-group">
          <button class="icon-btn" title="新增頂層世界觀" onclick="promptCreateWorldview()">🌐＋</button>
          <button class="icon-btn" title="新增資料夾" onclick="promptCreateFolder(null)">📁＋</button>
          <button class="icon-btn" title="新增文檔" onclick="createNewDoc(null)">📄＋</button>
          <button class="icon-btn" id="closeSidebarBtn" style="display:none;" onclick="closeSidebarMobile()">✕</button>
        </div>
      </div>

      <!-- Batch Delete Action Bar -->
      <div class="batch-bar" id="batchActionBar">
        <span>已進入批量刪除模式</span>
        <button class="btn btn-danger" style="padding:3px 8px; font-size:11px;" onclick="executeBatchDelete()">刪除選取項</button>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋標題、章節或 #標籤..." oninput="renderSidebarTree()">
      </div>

      <div class="tree-scroll-area" id="worldTreeContainer"></div>

      <div style="padding:10px 12px; border-top:1px solid var(--border); display:flex; gap:6px; min-width:320px;">
        <button class="btn btn-secondary" style="flex:1; justify-content:center;" onclick="openPaletteModal()">
          🎨 標籤顏色命名
        </button>
        <button class="btn btn-secondary" style="padding:6px 8px;" title="備份完整資料庫" onclick="exportFullDatabaseJSON()">💾 備份</button>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-view">
      <!-- 1. Document Editor -->
      <section id="editorView">
        <!-- Breadcrumb & Hierarchy Bar with Folder Hover -->
        <div class="breadcrumb-bar" id="docBreadcrumbBar"></div>

        <div class="editor-top-bar">
          <div class="editor-tools">
            <span>字數：<strong class="stat-pill" id="statWordCount">0</strong></span>
            <span>更新：<span id="statUpdatedAt">--</span></span>
          </div>

          <div class="editor-actions-right">
            <label class="btn btn-secondary" style="margin:0; cursor:pointer;" title="插入圖片">
              🖼️ 放圖片
              <input type="file" id="imgUploadInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
            </label>
            <button class="btn btn-secondary" onclick="addCurrentDocToCanvas()">📌 投射白板</button>
            <button class="btn btn-danger" title="刪除此文檔" onclick="deleteCurrentDocument()">🗑️ 刪除</button>
          </div>
        </div>

        <div class="editor-scroll-body">
          <!-- Title & Icon -->
          <div class="doc-title-row">
            <button class="doc-icon-picker-btn" id="docIconBtn" title="點擊自訂文檔 Icon" onclick="openIconPicker('doc', activeDocId)">📄</button>
            <input type="text" id="docTitleInput" class="title-input" placeholder="輸入文檔標題 (未填則自動取第一行)..." oninput="onTitleChange()">
          </div>

          <!-- Chapter Fast Navigation Jump TOC -->
          <div class="toc-card" id="tocCard" style="display:none;">
            <div class="toc-title">📑 章節快速跳轉 (內文輸入「# 章節名」或「第X章」可自動識別)</div>
            <div class="toc-links" id="tocLinksContainer"></div>
          </div>

          <!-- Hashtags Live Bar -->
          <div class="hashtag-toolbar" id="liveTagToolbar"></div>

          <!-- Document Attached Images -->
          <div class="doc-images-strip" id="docImagesContainer"></div>

          <!-- Content Body -->
          <textarea id="docContentInput" class="content-textarea" placeholder="在此書寫世界觀細節、章節大綱或角色背景...
💡 章節標註：輸入「# 第一章 啟程」或「第1章」系統會自動在頂部生成快速跳轉按鈕。
💡 標籤標註：輸入「#帝國軍方 #反抗勢力」系統會自動抽取；點擊上方 Hashtag 名稱可直接定位到內文段落！" oninput="onContentChange()"></textarea>
        </div>
      </section>

      <!-- 2. Whiteboard Canvas (Per-Worldview) -->
      <section id="canvasView">
        <div class="canvas-bar">
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-weight:700; font-size:13px;" id="canvasWorldTitle">🕸️ 關係白板</span>
            <span style="font-size:11px; color:var(--text-secondary);">💡 點擊「🔗」可連線並填寫雙方關係！</span>
          </div>
          <button class="btn btn-secondary" style="padding:4px 8px; font-size:11px;" onclick="renderCanvas()">🔄 重新整理</button>
        </div>

        <svg class="canvas-svg" id="canvasSvg"></svg>
        <div id="canvasNodesContainer"></div>

  </div>

  <!-- Modal: Batch Export Options -->
  <div class="modal-overlay" id="batchExportModal">
    <div class="modal-card">
      <div class="modal-title">📤 批量匯出文檔 / 資料夾</div>
      <p style="font-size:12px; color:var(--text-secondary);">勾選你要匯出的資料夾或個別文檔，系統將自動打包產生乾淨的 HTML / JSON / TXT 導出檔：</p>
      
      <div style="display:flex; gap:8px; margin-bottom:6px;">
        <button class="btn btn-secondary" style="font-size:11px; padding:3px 8px;" onclick="toggleExportAll(true)">全選</button>
        <button class="btn btn-secondary" style="font-size:11px; padding:3px 8px;" onclick="toggleExportAll(false)">取消全選</button>
      </div>

      <div style="border:1px solid var(--border); border-radius:var(--radius-md); padding:8px; max-height:260px; overflow-y:auto;" id="exportChecklistContainer"></div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
        <label style="font-size:12px; color:var(--text-secondary);">
          匯出格式：
          <select id="exportFormatSelect" style="padding:4px 8px; border-radius:var(--radius-sm); border:1px solid var(--border); font-size:12px;">
            <option value="html">獨立網頁 HTML 檔案 (排版最美、可直接點擊閱讀)</option>
            <option value="json">結構化 JSON 檔案 (完整備份)</option>
            <option value="txt">純文字 TXT 檔案</option>

        </label>
        <div style="display:flex; gap:6px;">

          <button class="btn btn-primary" onclick="confirmBatchExport()">開始匯出</button>
        </div>

    </div>
  </div>

  <!-- Modal: Palette Customizer -->
  <div class="modal-overlay" id="paletteModal">
    <div class="modal-card">
      <div class="modal-title">🎨 標籤顏色功能自定義命名</div>
      <p style="font-size:12px; color:var(--text-secondary);">為以下 7 組固定顏色定義小說專屬功能：</p>
      <div id="paletteConfigList"></div>
      <div style="display:flex; justify-content:flex-end;">
        <button class="btn btn-primary" onclick="closePaletteModal()">完成儲存</button>
      </div>
    </div>
  </div>

  <!-- Modal: Icon Picker -->
  <div class="modal-overlay" id="iconPickerModal">
    <div class="modal-card" style="width:340px;">
      <div class="modal-title">✨ 選擇自訂 Icon</div>
      <div class="emoji-grid" id="emojiGrid"></div>
      <div style="margin-top:10px;">
        <label style="font-size:12px; color:var(--text-secondary);">或手動輸入任何文字/符號：</label>
        <input type="text" id="customIconInput" class="form-input" maxlength="4" placeholder="例如：⚔️、🐉、A">
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px;">
        <button class="btn btn-primary" onclick="applyCustomIcon()">確定套用</button>
      </div>
    </div>
  </div>

  <!-- Modal: Move Folder -->
  <div class="modal-overlay" id="moveModal">
    <div class="modal-card">
      <div class="modal-title">🔀 移動資料夾或更改所屬世界觀</div>
      <p style="font-size:12px; color:var(--text-secondary);">選擇此資料夾欲移入的目的地：</p>
      <select id="moveTargetSelect" class="form-input"></select>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn btn-secondary" onclick="closeMoveModal()">取消</button>
        <button class="btn btn-primary" onclick="confirmMoveFolder()">確認移動</button>
      </div>
    </div>
  </div>

  <!-- Popover: Tag Color Picker -->
  <div class="color-picker-popup" id="colorPickerPopover"></div>

  <script>
    /* ==========================================================
       1. DATA STRUCTURE & STATE
       ========================================================== */
    const DEFAULT_PALETTES = {
      "c_gray":   { name: "一般隨記", bg: "#F3F4F6", text: "#374151" },
      "c_blue":   { name: "地理與勢力", bg: "#DBEAFE", text: "#1E40AF" },
      "c_green":  { name: "定稿與完成", bg: "#D1FAE5", text: "#065F46" },
      "c_purple": { name: "角色人物誌", bg: "#EDE9FE", text: "#5B21B6" },
      "c_orange": { name: "待釐清坑洞", bg: "#FFEDD5", text: "#9A3412" },
      "c_rose":   { name: "重要核心伏筆", bg: "#FFE4E6", text: "#9F1239" },
      "c_yellow": { name: "靈感隨筆", bg: "#FEF3C7", text: "#92400E" }
    };

    const COMMON_ICONS = ["📁", "🌍", "⚔️", "🛡️", "📜", "🏰", "🧙", "🐉", "🔮", "🔥", "💎", "🏛️", "👑", "🗡️", "🏹", "📖", "✨", "🔖"];

    let appData = {
      colorPalette: Object.assign({}, DEFAULT_PALETTES),
      tagSettings: {
        "帝國軍方": "c_blue",
        "反抗組織": "c_rose",
        "主角群": "c_purple"
      },
      worldviews: [
        {
          id: "w_main",
          name: "艾爾達斯主大陸",
          icon: "🌍",
          canvas: {
            nodes: [
              { id: "node_doc_1", docId: "doc_1", x: 40, y: 70 },
              { id: "node_doc_2", docId: "doc_2", x: 280, y: 150 }
            ],
            edges: [
              { id: "edge_1", source: "node_doc_1", target: "node_doc_2", label: "既敵對亦互相利用" }
            ]
          }
        },
        {
          id: "w_sub",
          name: "星界彼端 (外傳)",
          icon: "🔮",
          canvas: { nodes: [], edges: [] }
        }
      ],
      folders: [
        { id: "f_chars", worldId: "w_main", parentId: null, name: "核心角色群", icon: "👥" },
        { id: "f_knights", worldId: "w_main", parentId: "f_chars", name: "皇家騎士階級", icon: "⚔️" },
        { id: "f_lore", worldId: "w_main", parentId: null, name: "歷史年表", icon: "📜" }
      ],
      docs: [
        {
          id: "doc_1",
          worldId: "w_main",
          folderId: "f_knights",
          icon: "🛡️",
          title: "白銀騎士團長",
          content: "# 第一章 誓約之劍\n性格嚴謹肅穆，掌管皇城近衛軍，手握秘銀軍令狀。 #帝國軍方 #主角群\n\n# 第二章 北境之戰\n於舊曆340年率軍抵禦霜雪巨獸，戰役極為慘烈。",
          tags: ["帝國軍方", "主角群"],
          images: [],
          wordCount: 75,
          updatedAt: "2026-09-09 12:00"
        },
        {
          id: "doc_2",
          worldId: "w_main",
          folderId: "f_chars",
          icon: "🗡️",
          title: "暗夜遊俠",
          content: "# 第一章 陰影交匯\n遊走在黑市與皇城外圍的情報商人，表面玩世不恭，實際上是反抗軍的先鋒探子。 #反抗組織 #主角群",
          tags: ["反抗組織", "主角群"],
          images: [],
          wordCount: 52,
          updatedAt: "2026-09-09 12:10"
        }
      ]
    };

    let activeWorldId = "w_main";
    let activeDocId = "doc_1";
    let activeView = "editor";
    let isBatchDeleteMode = false;
    let iconPickerContext = { type: null, id: null };
    let moveFolderTargetId = null;
    let connectingSourceNodeId = null;
    let collapsedFolders = {};

    const saved = localStorage.getItem("novel_multi_world_data_v3");
    if (saved) {
      try { appData = JSON.parse(saved); } catch (e) { console.error(e); }
    }

    function saveData() {
      localStorage.setItem("novel_multi_world_data_v3", JSON.stringify(appData));
    }

    /* ==========================================================
       2. INITIALIZATION & SIDEBAR COLLAPSE
       ========================================================== */
    window.addEventListener("DOMContentLoaded", function() {
      buildEmojiPicker();
      renderSidebarTree();
      updateWorldBadge();
      loadDocToEditor(activeDocId);
      setupCanvasEvents();
      checkResponsiveMode();
    });

    window.addEventListener("resize", checkResponsiveMode);

    function checkResponsiveMode() {
      const isMobile = window.innerWidth <= 768;
      const closeBtn = document.getElementById("closeSidebarBtn");
      if (closeBtn) closeBtn.style.display = isMobile ? 'flex' : 'none';
      if (!isMobile) closeSidebarMobile();
    }

    function toggleSidebarMenu() {
      const isMobile = window.innerWidth <= 768;
      const sidebar = document.getElementById("appSidebar");
      const overlay = document.getElementById("sidebarOverlay");

      if (isMobile) {
        const isOpen = sidebar.classList.contains("drawer-open");
        if (isOpen) closeSidebarMobile();
        else {
          sidebar.classList.add("drawer-open");
          overlay.classList.add("active");
        }
      } else {
        // Desktop collapse toggle
        sidebar.classList.toggle("desktop-collapsed");
      }
    }

    function closeSidebarMobile() {
      document.getElementById("appSidebar").classList.remove("drawer-open");
      document.getElementById("sidebarOverlay").classList.remove("active");
    }

    function updateWorldBadge() {
      const world = appData.worldviews.find(function(w) { return w.id === activeWorldId; });
      if (world) {
        const icon = world.icon || '🌐';
        document.getElementById("currentWorldIcon").textContent = icon;
        document.getElementById("currentWorldName").textContent = world.name;
        document.getElementById("canvasWorldTitle").textContent = "🕸️ " + icon + " " + world.name + " · 專屬白板";
      }
    }

    /* ==========================================================
       3. BREADCRUMB WITH FOLDER HOVER
       ========================================================== */
    function renderBreadcrumb() {
      const bar = document.getElementById("docBreadcrumbBar");
      bar.innerHTML = "";

      const doc = appData.docs.find(function(d) { return d.id === activeDocId; });
      if (!doc) return;

      const world = appData.worldviews.find(function(w) { return w.id === doc.worldId; }) || { name: "未分類世界觀", icon: "🌐" };

      // 1. Worldview Breadcrumb Item
      const worldItem = document.createElement("span");
      worldItem.className = "breadcrumb-item";
      worldItem.innerHTML = `<span>${world.icon || '🌐'} @${escapeHtml(world.name)}</span>`;
      worldItem.onclick = function() {
        activeWorldId = world.id;
        updateWorldBadge();
        renderSidebarTree();
      };
      bar.appendChild(worldItem);

      // 2. Folder Hierarchy Items with hover dropdown
      const folderChain = [];
      let curFolderId = doc.folderId;
      while (curFolderId) {
        const f = appData.folders.find(function(item) { return item.id === curFolderId; });
        if (f) {
          folderChain.unshift(f);
          curFolderId = f.parentId;
        } else {
          break;
        }
      }

      folderChain.forEach(function(folder) {
        const sep = document.createElement("span");
        sep.className = "breadcrumb-sep";
        sep.textContent = ">";
        bar.appendChild(sep);

        const folderItem = document.createElement("span");
        folderItem.className = "breadcrumb-item";
        folderItem.innerHTML = `<span>${folder.icon || '📁'} ${escapeHtml(folder.name)}</span>`;

        // Hover dropdown to list docs in this folder
        const dropdown = document.createElement("div");
        dropdown.className = "hover-dropdown";

        const docsInFolder = appData.docs.filter(function(d) { return d.folderId === folder.id; });
        if (docsInFolder.length === 0) {
          dropdown.innerHTML = '<span style="font-size:11px; color:#94a3b8; padding:4px;">(尚無其他文檔)</span>';
        } else {
          docsInFolder.forEach(function(d) {
            const link = document.createElement("div");
            link.className = "dropdown-doc-link";
            link.innerHTML = `<span>${d.icon || '📄'}</span><span>${escapeHtml(d.title || '無標題')}</span>`;
            link.onclick = function(e) {
              e.stopPropagation();
              loadDocToEditor(d.id);
            };
            dropdown.appendChild(link);
          });
        }

        folderItem.appendChild(dropdown);
        bar.appendChild(folderItem);
      });

      // 3. Document Name Breadcrumb Item
      const sepDoc = document.createElement("span");
      sepDoc.className = "breadcrumb-sep";
      sepDoc.textContent = ">";
      bar.appendChild(sepDoc);

      const docItem = document.createElement("span");
      docItem.className = "breadcrumb-item";
      docItem.style.color = "var(--accent)";
      docItem.innerHTML = `<span>${doc.icon || '📄'} ${escapeHtml(doc.title || '無標題')}</span>`;
      bar.appendChild(docItem);
    }

    /* ==========================================================
       4. INLINE RENAME (MOBILE DOUBLE-TAP / DESKTOP RIGHT-CLICK & DBLCLICK)
       ========================================================== */
    function promptRenameItem(type, id, currentName) {
      const newName = prompt("請輸入新的名稱：", currentName);
      if (newName && newName.trim() && newName.trim() !== currentName) {
        const val = newName.trim();
        if (type === 'world') {
          const w = appData.worldviews.find(function(x) { return x.id === id; });
          if (w) w.name = val;
        } else if (type === 'folder') {
          const f = appData.folders.find(function(x) { return x.id === id; });
          if (f) f.name = val;
        } else if (type === 'doc') {
          const d = appData.docs.find(function(x) { return x.id === id; });
          if (d) {
            d.title = val;
            if (d.id === activeDocId) document.getElementById("docTitleInput").value = val;
          }
        }
        saveData();
        renderSidebarTree();
        renderBreadcrumb();
      }
    }

    function setupRenameTriggers(element, type, id, getNameFn) {
      // Desktop Right Click (Context Menu)
      element.addEventListener("contextmenu", function(e) {
        e.preventDefault();
        e.stopPropagation();
        promptRenameItem(type, id, getNameFn());
      });

      // Desktop Double Click
      element.addEventListener("dblclick", function(e) {
        e.preventDefault();
        e.stopPropagation();
        promptRenameItem(type, id, getNameFn());
      });

      // Mobile Double Tap
      let lastTap = 0;
      element.addEventListener("touchend", function(e) {
        const now = Date.now();
        if (now - lastTap < 320 && now - lastTap > 0) {
          e.preventDefault();
          e.stopPropagation();
          promptRenameItem(type, id, getNameFn());
        }
        lastTap = now;
      });
    }

    /* ==========================================================
       5. TREE RENDERING WITH FOLDER DRAG & FOLDER CREATE
       ========================================================== */
    function renderSidebarTree() {
      const container = document.getElementById("worldTreeContainer");
      const search = document.getElementById("searchInput").value.trim().toLowerCase();
      container.innerHTML = "";

      appData.worldviews.forEach(function(world) {
        const isCurrent = world.id === activeWorldId;
        const worldDiv = document.createElement("div");
        worldDiv.className = "world-block " + (isCurrent ? "active-world" : "");

        const header = document.createElement("div");
        header.className = "world-header";
        header.onclick = function() {
          activeWorldId = world.id;
          updateWorldBadge();
          renderSidebarTree();
          if (activeView === 'canvas') renderCanvas();
        };

        header.innerHTML = 
          '<div class="world-title-wrap">' +
            '<span class="node-icon" onclick="event.stopPropagation(); openIconPicker(\'world\', \'' + world.id + '\')">' + (world.icon || '🌐') + '</span>' +
            '<span class="node-name">' + escapeHtml(world.name) + '</span>' +
          '</div>' +
          '<div class="icon-btn-group">' +
            '<button class="icon-btn" title="在此外層新增資料夾" onclick="event.stopPropagation(); promptCreateFolder(null, \'' + world.id + '\')">📁＋</button>' +
            '<button class="icon-btn" title="在此外層新增文檔" onclick="event.stopPropagation(); createNewDoc(null, \'' + world.id + '\')">📄＋</button>' +
          '</div>';

        setupRenameTriggers(header.querySelector('.node-name'), 'world', world.id, function() { return world.name; });

        worldDiv.appendChild(header);

        const bodyDiv = document.createElement("div");
        bodyDiv.style.padding = "6px";

        renderFolderLevel(world.id, null, bodyDiv, search);
        worldDiv.appendChild(bodyDiv);
        container.appendChild(worldDiv);
      });
    }

    function renderFolderLevel(worldId, parentId, parentElement, search) {
      const folders = appData.folders.filter(function(f) {
        return f.worldId === worldId && f.parentId === parentId;
      });

      folders.forEach(function(folder) {
        const folderDiv = document.createElement("div");
        folderDiv.className = "folder-group";

        const isCollapsed = !!collapsedFolders[folder.id];
        const folderRow = document.createElement("div");
        folderRow.className = "node-row";
        folderRow.draggable = true;

        // Folder Drag Start
        folderRow.ondragstart = function(e) {
          e.stopPropagation();
          e.dataTransfer.setData("text/plain", JSON.stringify({ type: "folder", id: folder.id }));
        };

        folderRow.onclick = function(e) {
          if (e.target.closest('.node-checkbox') || e.target.closest('.node-actions') || e.target.closest('.node-icon')) return;
          collapsedFolders[folder.id] = !collapsedFolders[folder.id];
          renderSidebarTree();
        };

        const toggleCaret = isCollapsed ? '▸' : '▾';

        folderRow.innerHTML = 
          '<div class="node-left">' +
            '<input type="checkbox" class="node-checkbox" data-type="folder" data-id="' + folder.id + '" onclick="event.stopPropagation()">' +
            '<span class="folder-caret" style="font-size:11px; color:var(--text-muted); cursor:pointer; width:12px;">' + toggleCaret + '</span>' +
            '<span class="node-icon" onclick="event.stopPropagation(); openIconPicker(\'folder\', \'' + folder.id + '\')">' + (folder.icon || '📁') + '</span>' +
            '<span class="node-name">' + escapeHtml(folder.name) + '</span>' +
          '</div>' +
          '<div class="node-actions">' +
            '<button class="icon-btn" title="在此資料夾直接建檔" onclick="event.stopPropagation(); createNewDoc(\'' + folder.id + '\', \'' + worldId + '\')">📄＋</button>' +
            '<button class="icon-btn" title="新增子資料夾" onclick="event.stopPropagation(); promptCreateFolder(\'' + folder.id + '\', \'' + worldId + '\')">📁＋</button>' +
            '<button class="icon-btn" title="移動資料夾" onclick="event.stopPropagation(); promptMoveFolder(\'' + folder.id + '\')">🔀</button>' +
          '</div>';

        // Setup Rename on Folder Name
        setupRenameTriggers(folderRow.querySelector('.node-name'), 'folder', folder.id, function() { return folder.name; });

        // Drag & Drop into this folder (Accepts both Docs and other Folders!)
        folderRow.ondragover = function(e) { e.preventDefault(); folderRow.classList.add("drag-over"); };
        folderRow.ondragleave = function() { folderRow.classList.remove("drag-over"); };
        folderRow.ondrop = function(e) {
          e.preventDefault();
          e.stopPropagation();
          folderRow.classList.remove("drag-over");
          
          try {
            const dragPayload = JSON.parse(e.dataTransfer.getData("text/plain"));
            if (dragPayload.type === "doc") {
              const doc = appData.docs.find(function(d) { return d.id === dragPayload.id; });
              if (doc) {
                doc.folderId = folder.id;
                doc.worldId = worldId;
                saveData();
                renderSidebarTree();
                renderBreadcrumb();
              }
            } else if (dragPayload.type === "folder") {
              // Move folder inside this folder (prevent moving into itself or its descendants)
              const movingFolderId = dragPayload.id;
              if (movingFolderId !== folder.id && !isDescendantOf(movingFolderId, folder.id)) {
                const f = appData.folders.find(function(x) { return x.id === movingFolderId; });
                if (f) {
                  f.parentId = folder.id;
                  f.worldId = worldId;
                  saveData();
                  renderSidebarTree();
                  renderBreadcrumb();
                }
              }
            }
          } catch(err) {
            // Fallback plain docId
            const draggedId = e.dataTransfer.getData("text/plain");
            const doc = appData.docs.find(function(d) { return d.id === draggedId; });
            if (doc) {
              doc.folderId = folder.id;
              doc.worldId = worldId;
              saveData();
              renderSidebarTree();
              renderBreadcrumb();
            }
          }
        };

        folderDiv.appendChild(folderRow);

        const childrenDiv = document.createElement("div");
        childrenDiv.className = "folder-children";
        if (isCollapsed && !search) {
          childrenDiv.style.display = "none";
        }

        renderFolderLevel(worldId, folder.id, childrenDiv, search);

        const docsInFolder = appData.docs.filter(function(d) {
          const matchFolder = d.worldId === worldId && d.folderId === folder.id;
          if (!search) return matchFolder;
          return matchFolder && (d.title.toLowerCase().includes(search) || d.content.toLowerCase().includes(search));
        });

        docsInFolder.forEach(function(doc) {
          childrenDiv.appendChild(createDocRowElement(doc));
        });

        folderDiv.appendChild(childrenDiv);
        parentElement.appendChild(folderDiv);
      });

      if (parentId === null) {
        const rootDocs = appData.docs.filter(function(d) {
          const isRoot = d.worldId === worldId && !d.folderId;
          if (!search) return isRoot;
          return isRoot && (d.title.toLowerCase().includes(search) || d.content.toLowerCase().includes(search));
        });
        rootDocs.forEach(function(doc) {
          parentElement.appendChild(createDocRowElement(doc));
        });
      }
    }

    function isDescendantOf(parentCheckId, targetFolderId) {
      let cur = targetFolderId;
      while (cur) {
        if (cur === parentCheckId) return true;
        const f = appData.folders.find(function(x) { return x.id === cur; });
        cur = f ? f.parentId : null;
      }
      return false;
    }

    function createDocRowElement(doc) {
      const row = document.createElement("div");
      row.className = "node-row " + (doc.id === activeDocId ? "active" : "");
      row.draggable = true;
      row.ondragstart = function(e) {
        e.stopPropagation();
        e.dataTransfer.setData("text/plain", JSON.stringify({ type: "doc", id: doc.id }));
      };
      row.onclick = function() {
        activeWorldId = doc.worldId;
        updateWorldBadge();
        loadDocToEditor(doc.id);
        if (activeView !== 'editor') switchView('editor');
        if (window.innerWidth <= 768) closeSidebarMobile();
      };

      let displayTitle = doc.title;
      if (!displayTitle) {
        const firstLine = (doc.content || "").split("\n")[0];
        displayTitle = firstLine ? firstLine.substring(0, 16) : "無標題文檔";
      }

      row.innerHTML = 
        '<div class="node-left">' +
          '<input type="checkbox" class="node-checkbox" data-type="doc" data-id="' + doc.id + '" onclick="event.stopPropagation()">' +
          '<span class="node-icon" onclick="event.stopPropagation(); openIconPicker(\'doc\', \'' + doc.id + '\')">' + (doc.icon || '📄') + '</span>' +
          '<span class="node-name">' + escapeHtml(displayTitle) + '</span>' +
        '</div>' +
        '<div class="doc-meta-mini">' + (doc.wordCount || 0) + '字</div>';

      setupRenameTriggers(row.querySelector('.node-name'), 'doc', doc.id, function() { return doc.title || ''; });

      return row;
    }

       6. DOCUMENT CREATION & EDITING

        const newWorld = {
          id: "w_" + Date.now(),

        };

        saveData();

      }

    function promptCreateFolder(parentId = null, worldId = null) {
      const name = prompt("請輸入資料夾名稱：", "新分類");
      if (name && name.trim()) {
        appData.folders.push({
          id: "f_" + Date.now(),

        });

    // Direct create inside targeted folder
    function createNewDoc(targetFolderId = null, worldId = null) {
      const wId = worldId || activeWorldId;
      const newDoc = {
        id: "doc_" + Date.now(),
        worldId: wId,
        folderId: targetFolderId,
        icon: "📄",
        title: "",
        content: "",
        tags: [],
        images: [],
        wordCount: 0,
        updatedAt: formatTime(new Date())
      };
      appData.docs.unshift(newDoc);
      activeWorldId = wId;
      updateWorldBadge();
      saveData();
      renderSidebarTree();
      loadDocToEditor(newDoc.id);
      switchView('editor');
      if (window.innerWidth <= 768) closeSidebarMobile();
